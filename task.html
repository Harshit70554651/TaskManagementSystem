<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Management System</title>
    <link rel="stylesheet" href="task.css" />
  </head>
  <body>
    <main>
      <nav>
        <div class="left">Kanban</div>
        <div class="right"><button>Add new Task</button></div>
      </nav>
      <section class="board">
        <div class="task-column" id="todo">
          <div class="heading">
            <div class="left">To DO</div>
            <div class="right">Count</div>
          </div>
          <div class="task" draggable="true">
          <h2>Task 1</h2>
          <p>Description for task</p>
          <button>Delete</button>
          </div>
        </div>

        <div class="task-column" id="progress">
          <div class="heading">
            <div class="left">In Progress</div>
            <div class="right">Count</div>
          </div>
        </div>

        <div class="task-column" id="done">
          <div class="heading">
            <div class="left">Done</div>
            <div class="right">Count</div>
          </div>
        </div>
      </section>
    </main>
    <script src="task.js"></script>
  </body>
</html>
