<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Management System</title>
    <link rel="stylesheet" href="task.css" />
  </head>
  <body>
    <main>
      <nav>
        <div class="left">Kanban</div>
        <div class="right"><button id="toggle-modal">Add new Task</button></div>
      </nav>
      <section class="board">
        <div class="task-column" id="todo">
          <div class="heading">
            <div class="left">To DO</div>
            <div class="right">0</div>
          </div>

        </div>

        <div class="task-column" id="progress">
          <div class="heading">
            <div class="left">In Progress</div>
            <div class="right">0</div>
          </div>
        </div>

        <div class="task-column" id="done">
          <div class="heading">
            <div class="left">Done</div>
            <div class="right">0</div>
          </div>
        </div>
      </section>
    </main>
    <div class="modal add-new-task">
      <div class="bg"></div>
      <div class="center">
        <input type="text" placeholder="Task Title"  id="task-title"/>
        <textarea name="" id="task-Description" placeholder="Task Description"></textarea>
        <button class="add-task-btn" id="add-new-task">Add Task</button>
      </div>
    </div>
    <script src="task.js"></script>
  </body>
</html>
